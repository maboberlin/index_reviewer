spring.application.name=IndexReviewer

# In-memory H2, schema recreated from the entities on every start up.
spring.datasource.url=jdbc:h2:mem:indexreviewer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

# Browse the data at http://localhost:8080/h2-console (JDBC URL as above, user sa).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON contract uses snake_case (data_type, index_type, review_status, ...).
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Definition of each index review: the dates it reads data on and the rules it
# applies. Part of the index definition, not runtime state, so it lives here
# rather than in the database. Validated at start up.
# Q3 2026: price is taken on the cut-off date, everything else on the review date.
index-review.definitions.SMI_INDEX_REVIEW_Q3_2026.cut-off-date=2026-09-10
index-review.definitions.SMI_INDEX_REVIEW_Q3_2026.review-date=2026-09-21
index-review.definitions.SMI_INDEX_REVIEW_Q3_2026.target-size=20
index-review.definitions.SMI_INDEX_REVIEW_Q3_2026.max-weight=0.18
index-review.definitions.SMI_INDEX_REVIEW_Q3_2026.selection-buffer=2
